name: Runtime ABI tests
on:
  pull_request:
    paths:
      - 'app/**'
      - 'runtime/**'
      - 'docker/Dockerfile'
      - 'tests/**'
      - '.github/workflows/build-env-image.yml'
      - '.github/workflows/test-runtime.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
